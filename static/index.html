<!DOCTYPE html>
<html lang="de-CH">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>Chneblä Schwyz</title>
  <link rel="preconnect" href="https://fonts.jimstatic.com">
  <link
    rel="stylesheet"
    href="https://fonts.jimstatic.com/css?family=Exo+2:200,300,400,700|Open+Sans:300,400,700&amp;subset=latin,latin-ext"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    button,
    textarea {
      font-family: inherit;
    }

    body {
      margin: 0;
      font-family:
        "Exo 2",
        "Segoe UI",
        sans-serif;
      font-weight: 300;
      background-color: #385f30;
      background-image:
        url("./static/background.jpg"),
        url("background.jpg");
      background-position: center;
      background-size: cover;
      background-attachment: fixed;
      color: #202020;
    }

    .page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 24px 12px;
    }

    .app {
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      min-height: calc(100vh - 48px);
      background: rgba(255, 255, 255, 0.84);
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
    }

    header {
      position: relative;
      padding: 20px 24px;
      background: rgba(255, 255, 255, 0.34);
      color: #202020;
      border-bottom: 1px solid #d8d8d5;
    }

    .brand {
      padding-right: 62px;
    }

    .brand-logo {
      position: absolute;
      top: 14px;
      right: 20px;
      width: 48px;
      height: 48px;
      object-fit: contain;
    }

    header h1 {
      margin: 0 0 5px;
      font-family: "Open Sans", "Segoe UI", sans-serif;
      font-weight: 300;
      font-size: 1.45rem;
      letter-spacing: 0.02em;
    }

    header p {
      margin: 0;
      color: #686868;
      font-size: 0.92rem;
    }

    .suggestions {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: stretch;
      gap: 8px;
      padding: 16px 20px 0;
    }

    .suggestion {
      flex: 1 1 145px;
      border: 1px solid #d1d5db;
      background: white;
      color: #202020;
      border-radius: 999px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 0.84rem;
      text-align: center;
      transition:
        background-color 0.2s ease,
        color 0.2s ease,
        border-color 0.2s ease;
    }

    .suggestion:hover {
      background: #202020;
      color: #ffffff;
    }

    #messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .message {
      display: flex;
      margin-bottom: 15px;
    }

    .message.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 82%;
      padding: 11px 14px;
      border-radius: 15px;
      line-height: 1.45;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .assistant .bubble {
      background: #eef2ef;
      border-bottom-left-radius: 4px;
    }

    .user .bubble {
      background: #202020;
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .status {
      color: #6b7280;
      font-size: 0.9rem;
      font-style: italic;
    }

    .error .bubble {
      background: #fee2e2;
      color: #991b1b;
    }

    form {
      display: flex;
      gap: 10px;
      padding: 16px;
      border-top: 1px solid #e5e7eb;
      background: rgba(255, 255, 255, 0.34);
    }

    textarea {
      flex: 1;
      min-height: 46px;
      max-height: 130px;
      resize: none;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 12px;
      font: inherit;
    }

    textarea:focus {
      outline: 2px solid #707070;
      border-color: transparent;
    }

    button[type="submit"] {
      border: 0;
      border-radius: 12px;
      padding: 0 19px;
      background: #202020;
      color: #ffffff;
      cursor: pointer;
      font-weight: 600;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    footer {
      padding: 0 18px 14px;
      color: #6b7280;
      font-size: 0.76rem;
      text-align: center;
    }

    @media (max-width: 600px) {
      .page {
        padding: 0;
      }

      .app {
        min-height: 100vh;
        border-radius: 0;
      }

      .bubble {
        max-width: 90%;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <main class="app">
      <header>
        <div class="brand">
          <div>
            <h1>Chneblä Schwyz</h1>
            <p>
              Fragen zur Chneblermeisterschaft
            </p>
          </div>

          <img
            class="brand-logo"
            src="./static/logo-black.png"
            alt=""
            aria-hidden="true"
            onerror="this.onerror=null; this.src='logo-black.png';"
          >
        </div>
      </header>
      <section
        class="suggestions"
        aria-label="Beispielfragen"
      >
        <button
          class="suggestion"
          type="button"
          data-question="Wann findet die Chneblermeisterschaft statt?"
        >
          Datum und Zeit
        </button>

        <button
          class="suggestion"
          type="button"
          data-question="Was kostet ein Cardinal Blonde?"
        >
          Getränkepreise
        </button>

        <button
          class="suggestion"
          type="button"
          data-question="Was passiert bei Punktgleichheit?"
        >
          Reglement
        </button>

        <button
          class="suggestion"
          type="button"
          data-question="Wer gewann 2017 bei den Männern?"
        >
          Ranglisten
        </button>
      </section>

      <section
        id="messages"
        aria-live="polite"
      >
        <div class="message assistant">
          <div class="bubble">Hoi! Was möchtest du über die Chneblermeisterschaft wissen?</div>
        </div>
      </section>

      <form id="chat-form">
        <textarea
          id="message-input"
          maxlength="500"
          placeholder="Frage eingeben …"
          aria-label="Nachricht"
          required
        ></textarea>

        <button
          id="send-button"
          type="submit"
        >
          Senden
        </button>
      </form>

      <footer>
        Der Chatbot kann Fehler machen. Alle Angaben ohne Gewähr.
      </footer>
    </main>
  </div>

  <script>
    const form = document.getElementById("chat-form");
    const input = document.getElementById("message-input");
    const sendButton = document.getElementById("send-button");
    const messages = document.getElementById("messages");

    function addMessage(text, role, extraClass = "") {
      const wrapper = document.createElement("div");
      wrapper.className = `message ${role} ${extraClass}`.trim();

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;

      wrapper.appendChild(bubble);
      messages.appendChild(wrapper);
      messages.scrollTop = messages.scrollHeight;

      return wrapper;
    }

    async function sendMessage(question) {
      const cleanedQuestion = question.trim();

      if (!cleanedQuestion) {
        return;
      }

      addMessage(cleanedQuestion, "user");
      input.value = "";
      sendButton.disabled = true;
      input.disabled = true;

      const loadingMessage = addMessage(
        "Antwort wird gesucht …",
        "assistant",
        "status"
      );

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: cleanedQuestion
          })
        });

        let data;

        try {
          data = await response.json();
        } catch {
          data = {};
        }

        loadingMessage.remove();

        if (!response.ok) {
          throw new Error(
            data.detail || `HTTP-Fehler ${response.status}`
          );
        }

        addMessage(
          data.answer || "Es wurde keine Antwort erzeugt.",
          "assistant"
        );
      } catch (error) {
        loadingMessage.remove();

        addMessage(
          `Die Anfrage ist fehlgeschlagen: ${error.message}`,
          "assistant",
          "error"
        );
      } finally {
        sendButton.disabled = false;
        input.disabled = false;
        input.focus();
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      await sendMessage(input.value);
    });

    input.addEventListener("keydown", async (event) => {
      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {
        event.preventDefault();

        if (!sendButton.disabled) {
          await sendMessage(input.value);
        }
      }
    });

    document
      .querySelectorAll(".suggestion")
      .forEach((button) => {
        button.addEventListener("click", async () => {
          await sendMessage(button.dataset.question);
        });
      });
  </script>
</body>
</html>
